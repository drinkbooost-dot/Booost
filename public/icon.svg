<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b3e28"/>
      <stop offset="50%" stop-color="#0e4a30"/>
      <stop offset="100%" stop-color="#051c13"/>
    </linearGradient>
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84cc16"/>
      <stop offset="100%" stop-color="#cbf738"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#84cc16" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Rounded Base Background with safe padding -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  
  <!-- Outer Accent Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#84cc16" stroke-width="4" stroke-opacity="0.25"/>

  <!-- Shake Cup Icon Graphic -->
  <g transform="translate(0, -10)">
    <!-- Cup Body -->
    <path d="M190 220 L205 380 Q210 405 235 405 L277 405 Q302 405 307 380 L322 220 Z" fill="#ffffff" filter="url(#glow)"/>
    
    <!-- Shake Liquid Core -->
    <path d="M196 240 L208 375 Q212 393 232 393 L280 393 Q300 393 304 375 L316 240 Z" fill="url(#limeGrad)"/>
    
    <!-- Shake Whipped Wave / Blend Texture -->
    <path d="M208 280 Q256 260 304 285 L300 320 Q256 300 212 320 Z" fill="#ffffff" fill-opacity="0.3"/>
    
    <!-- Cup Lid -->
    <path d="M175 220 Q175 195 256 195 Q337 195 337 220 Z" fill="#ffffff"/>
    
    <!-- Straw -->
    <path d="M256 195 L275 110 Q278 100 290 100 L320 100" fill="none" stroke="#84cc16" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Lightning Energy Bolt on Cup -->
    <path d="M262 275 L242 315 L257 315 L247 355 L275 305 L260 305 Z" fill="#0b3e28"/>
  </g>

  <!-- Brand Typography -->
  <text x="256" y="455" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="4">
    BOOOST
  </text>
  
  <!-- Little Fresh Leaf Spark -->
  <circle cx="340" cy="180" r="10" fill="#cbf738" filter="url(#glow)"/>
</svg>
